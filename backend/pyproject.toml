[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dolosmeta"
version = "1.0.0"
description = "Native universal file metadata and forensics engine"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30,<1",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["dolosmeta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
