name: CI

on:
  push:
    branches:
      - main
      - netlify-readiness-2026-08-20
      - backend-autostart-render-2026-08-20
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Ruff
        run: cd backend && ruff check .
      - name: Pytest
        run: cd backend && pytest -q

  backend-container:
    name: Backend container smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t dolosmeta-api:test .
      - name: Start backend container
        run: docker run -d --name dolosmeta-api -e PORT=8000 -p 8000:8000 dolosmeta-api:test
      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs dolosmeta-api
          exit 1
      - name: Show backend logs on failure
        if: failure()
        run: docker logs dolosmeta-api || true
